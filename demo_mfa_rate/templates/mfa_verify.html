<!doctype html>
<html>
<head><meta charset="utf-8"><title>MFA Verify</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
  <div class="box">
    <h2>Enter code from Authenticator</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for cat,msg in messages %}
          <div class="flash {{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post">
       <input name="otp" placeholder="6-digit code" required>
       <button type="submit">Verify</button>
    </form>
  </div>
</body>
</html>
