<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>429 - Too Many Requests</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body { display:flex; align-items:center; justify-content:center; height:100vh; background:#ffdff1; margin:0; }
    .error-box {
      background:white; padding:40px; border-radius:12px;
      box-shadow:0 6px 20px rgba(0,0,0,0.1); max-width:400px; text-align:center;
    }
    h1 { font-size:3em; margin:0; color:#ff54c9; }
    p { margin:15px 0; color:#444; }
    .btn { display:inline-block; margin-top:20px; padding:10px 18px;
           background:#ff00ae; color:#fff; text-decoration:none; border-radius:8px; }
    .btn:hover { background:#ff54c9; }
  </style>
</head>
<body>
  <div class="error-box">
    <h1>429</h1>
    <h2>{{ error }}</h2>
    <p>{{ description }}</p>
    <a class="btn" href="{{ url_for('login') }}">กลับไปหน้า Login</a>
  </div>
</body>
</html>
